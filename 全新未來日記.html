                healing: { label: '自我療癒', color: 'text-pink-400', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' },
                growth: { label: '自信成長', color: 'text-blue-400', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>' },
                future: { label: '顯化奇蹟', color: 'text-purple-500', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' }
            };
            return { text: quote.q, ...UI[quote.t] };
        }

        // --- 視圖切換與渲染 ---
        function switchView(viewName) {
            document.querySelectorAll('.view-layer').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            if(viewName === 'diary') renderDiary();
            if(viewName === 'overview') renderOverview();
        }

        function startApp() {
            const today = new Date(); today.setHours(0,0,0,0);
            if (today >= START_DATE && today <= END_DATE) currentDate = today;
            else if (today > END_DATE) currentDate = END_DATE;
            else currentDate = START_DATE;
            switchView('diary');
        }

        function changeDay(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            if(currentDate < START_DATE) switchView('cover');
            else if(currentDate > END_DATE) switchView('end');
            else renderDiary();
        }

        function jumpToMonth(y, m) {
            const today = new Date();
            let target = new Date(y, m, 1);
            if (y === today.getFullYear() && m === today.getMonth()) {
                target = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            }
            if(target < START_DATE) target = new Date(START_DATE);
            if(target > END_DATE) target = new Date(END_DATE);
            currentDate = target;
            switchView('diary');
        }

        function debounceSave(field) {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const val = document.getElementById('input-' + field).value;
                const dKey = getDateKey(currentDate);
                if(!entries[dKey]) entries[dKey] = {};
                entries[dKey][field] = val;
                localStorage.setItem('flow_journal_vanilla', JSON.stringify(entries));
                
                const ind = document.getElementById('save-indicator');
                ind.classList.remove('opacity-0', 'translate-y-4');
                ind.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    ind.classList.remove('opacity-100', 'translate-y-0');
                    ind.classList.add('opacity-0', 'translate-y-4');
                }, 1000);
            }, 1000);
        }

        function renderNav() {
            let desktopHtml = ''; let mobileHtml = '';
            const cy = currentDate.getFullYear(); const cm = currentDate.getMonth();
            
            NAV_MONTHS.forEach((nav) => {
                const isCurrent = (cy === nav.year && cm === nav.month);
                
                desktopHtml += `<button onclick="jumpToMonth(${nav.year}, ${nav.month})" class="w-full flex items-center justify-center py-3 transition-all relative ${isCurrent ? 'text-[#a8c3b4] font-bold scale-110' : 'text-[#d3cdc4] hover:text-[#a8c3b4]'}"><span class="font-serif text-base tracking-widest">${nav.label}</span>${isCurrent ? '<div class="absolute right-0 w-1 h-6 bg-[#a8c3b4] rounded-l-full"></div>' : ''}</button>`;
                
                mobileHtml += `<button onclick="jumpToMonth(${nav.year}, ${nav.month})" class="font-serif text-base flex-shrink-0 transition-colors ${isCurrent ? 'text-[#a8c3b4] font-bold border-b-2 border-[#a8c3b4]' : 'text-[#d3cdc4]'}">${nav.label}</button>`;
            });
            
            document.getElementById('desktop-nav').innerHTML = desktopHtml;
            document.getElementById('mobile-nav').innerHTML = mobileHtml;
        }

        function renderDiary() {
            renderNav();
            document.getElementById('diary-day-index').innerText = `Day ${getDayDiff(currentDate, START_DATE) + 1}`;
            document.getElementById('diary-date-string').innerText = currentDate.toLocaleDateString('zh-TW', { month:'2-digit', day:'2-digit', weekday:'short' });

            const wisdom = getDailyWisdom(currentDate);
            const badge = document.getElementById('wisdom-badge');
            badge.className = `absolute -top-3 bg-[#fdfbf7] px-3 py-1 rounded-full border border-[#eceae5] flex items-center gap-1.5 text-xs tracking-wider shadow-sm ${wisdom.color}`;
            document.getElementById('wisdom-icon').innerHTML = wisdom.icon;
            document.getElementById('wisdom-label').innerText = wisdom.label;
            document.getElementById('wisdom-text').innerText = wisdom.text;

            let absMonth = (currentDate.getFullYear() - 2026) * 12 + currentDate.getMonth() - 5;
            if (absMonth < 0) absMonth = 0; if (absMonth > 18) absMonth = 18;
            const content = MONTHLY_TITLES[absMonth];

            document.getElementById('label-1').innerText = content.t1;
            document.getElementById('input-gratitude').placeholder = content.p1;
            document.getElementById('label-2').innerText = content.t2;
            document.getElementById('input-manifestation').placeholder = content.p2;
            document.getElementById('label-3').innerText = content.t3;
            document.getElementById('input-selftalk').placeholder = content.p3;

            const dKey = getDateKey(currentDate);
            document.getElementById('input-gratitude').value = entries[dKey]?.gratitude || '';
            document.getElementById('input-manifestation').value = entries[dKey]?.manifestation || '';
            document.getElementById('input-selftalk').value = entries[dKey]?.selftalk || '';
            
            document.getElementById('diary-scroll-area').scrollTo(0,0);
        }

        function renderOverview() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('overview-title').innerText = `${year} / ${String(month + 1).padStart(2, '0')}`;
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            
            let html = '';
            ['日', '一', '二', '三', '四', '五', '六'].forEach(d => {
                html += `<div class="text-center text-xs text-[#d3cdc4] font-serif py-2">${d}</div>`;
            });
            
            for(let i=0; i<firstDay; i++) html += `<div></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dKey = getDateKey(dateObj);
                const isSel = (dKey === getDateKey(currentDate));
                const isOutOfRange = (dateObj < START_DATE || dateObj > END_DATE);
                const hasData = entries[dKey] && (entries[dKey].gratitude || entries[dKey].manifestation || entries[dKey].selftalk);
                
                let btnClass = `aspect-square rounded-xl flex flex-col items-center justify-center border shadow-sm transition-all `;
                if(isOutOfRange) btnClass += `opacity-20 cursor-not-allowed border-transparent bg-white`;
                else if(isSel) btnClass += `border-[#a8c3b4] bg-[#f0f7f4] font-bold text-[#5a5a5a]`;
                else btnClass += `border-transparent bg-white text-[#8b7e74] hover:border-[#eceae5]`;
                
                html += `<button ${isOutOfRange ? 'disabled' : `onclick="setCurrentDateAndGo(${year}, ${month}, ${d})"`} class="${btnClass}">
                            <span class="font-num text-sm">${d}</span>
                            ${(!isOutOfRange && hasData) ? '<div class="w-1.5 h-1.5 rounded-full bg-[#a8c3b4] mt-1"></div>' : ''}
                         </button>`;
            }
            document.getElementById('calendar-grid').innerHTML = html;
        }

        function setCurrentDateAndGo(y,m,d) {
            currentDate = new Date(y,m,d);
            switchView('diary');
        }

        function openSearch() { document.getElementById('search-modal').classList.add('modal-active'); document.getElementById('search-input').focus(); }
        function closeSearch() { document.getElementById('search-modal').classList.remove('modal-active'); }
        
        function performSearch() {
            const q = document.getElementById('search-input').value.trim();
            const res = document.getElementById('search-results');
            res.innerHTML = '';
            if(!q) return;
            
            let html = '';
            Object.entries(entries).forEach(([k, d]) => {
                if(`${d.gratitude||''} ${d.manifestation||''} ${d.selftalk||''}`.includes(q)) {
                    html += `<div onclick="setCurrentDateAndGo(${k.split('-')[0]}, ${k.split('-')[1]-1}, ${k.split('-')[2]}); closeSearch();" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer hover:border-[#a8c3b4] transition-colors mb-4">
                        <div class="text-xs text-[#a8c3b4] font-serif mb-2">${k}</div>
                        ${d.gratitude ? `<div class="text-sm text-gray-600 truncate"><span class="text-[#d48c8c]">♥</span> ${d.gratitude}</div>` : ''}
                        ${d.manifestation ? `<div class="text-sm text-gray-600 truncate"><span class="text-[#8ca890]">✦</span> ${d.manifestation}</div>` : ''}
                        ${d.selftalk ? `<div class="text-sm text-gray-600 truncate"><span class="text-[#8cbcd4]">☺</span> ${d.selftalk}</div>` : ''}
                    </div>`;
                }
            });
            res.innerHTML = html || '<div class="text-center text-gray-400 py-10">無相關紀錄</div>';
        }

        // 初始化開啟封面
        window.onload = () => switchView('cover');
    </script>
</body>
</html>
